
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un diciembre entre nosotras</title>

    <!-- TIPOGRAFÍAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="style.css">

    <!-- FUNCIONAMIENTO -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- ===================================
         PANTALLA 1: PORTADA
    ==================================== -->

    <main id="portada" class="portada">

        <div class="marco">

            <!-- RAMA SUPERIOR IZQUIERDA -->
            <div class="rama rama-superior" aria-hidden="true">
                <span class="tallo"></span>
                <span class="hoja hoja-1"></span>
                <span class="hoja hoja-2"></span>
                <span class="hoja hoja-3"></span>
                <span class="hoja hoja-4"></span>
                <span class="hoja hoja-5"></span>
                <span class="hoja hoja-6"></span>

                <span class="baya baya-1"></span>
                <span class="baya baya-2"></span>
                <span class="baya baya-3"></span>
            </div>

            <!-- RAMA INFERIOR DERECHA -->
            <div class="rama rama-inferior" aria-hidden="true">
                <span class="tallo"></span>
                <span class="hoja hoja-1"></span>
                <span class="hoja hoja-2"></span>
                <span class="hoja hoja-3"></span>
                <span class="hoja hoja-4"></span>
                <span class="hoja hoja-5"></span>
                <span class="hoja hoja-6"></span>

                <span class="baya baya-1"></span>
                <span class="baya baya-2"></span>
                <span class="baya baya-3"></span>
            </div>

            <!-- ESTRELLAS DORADAS -->
            <div class="estrellas" aria-hidden="true">
                ✧ ⋆ ✧
            </div>

            <!-- CONTENIDO CENTRAL -->
            <div class="contenido">

                <h1>UN DICIEMBRE</h1>

                <h2>entre nosotras</h2>

                <!-- CORAZÓN DECORATIVO -->
                <div class="adorno-corazon" aria-hidden="true">
                    <span class="linea"></span>
                    <span class="corazon">♥</span>
                    <span class="linea"></span>
                </div>

                <p class="subtitulo">
                    Que comience la magia!
                </p>
<p class="dedicatoria-yai">
    Para Yai, con todo mi amor
</p>
                <button id="comenzar" type="button">
                    COMENZAR
                </button>

            </div>

            <!-- ESTRELLAS INFERIORES -->
            <div class="decoracion" aria-hidden="true">
                ✦ &nbsp; ✧ &nbsp; ✦
            </div>

        </div>

    </main>


    <!-- ===================================
         PANTALLA 2: CALENDARIO
    ==================================== -->

    <section id="calendario" class="calendario" hidden>

        
<div class="calendario-cabecera">
    <p class="calendario-etiqueta">DICIEMBRE · 2026</p>

    <h2>24 días, 24 sobres.</h2>

    <p class="calendario-subtitulo">
        He preparado algo especial para cada día.
        El resto tendrás que descubrirlo tú.
    </p>
</div>


        <!-- LOS 24 SOBRES -->
        <div id="sobres" class="sobres"></div>

        <!-- BOTÓN VOLVER -->
        <button id="volver" class="boton-volver" type="button">
            ← Volver a la portada
        </button>

    </section>

</body>
</html>
